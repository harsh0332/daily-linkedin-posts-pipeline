name: Daily Autonomous LinkedIn Publisher

on:
  schedule:
    # 04:00 UTC = 09:30 AM IST (Monday to Friday)
    - cron: '0 4 * * 1-5'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Puppeteer & System Dependencies for Chromium
        run: |
          npm install
          npx puppeteer browsers install chrome

      - name: Run Daily LinkedIn Publishing
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          MESH_API_KEY: ${{ secrets.MESH_API_KEY }}
        run: |
          node run_daily_cloud_publish.cjs

      - name: Commit and push updated state memory
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add used_topics.json used_sources.json pipeline_state.json scheduled_posts_queue.json sources/ || true
          if git status --porcelain | grep -q .; then
            git commit -m "chore(pipeline): update state memory after daily publish [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
